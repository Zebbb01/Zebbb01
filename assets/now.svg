    <text x="56" y="146" font-size="14.5" fill="#A09882">Multi-tenant, BIR-compliant accounting platform for Philippine businesses. Sole engineer &#8212; architecture, compliance, AI layer, tests.</text>
  </g>

  <rect x="56" y="180" width="1088" height="1" fill="#1F1F1F"/>

  <g font-family="'Outfit','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="27" font-weight="500" fill="#D4AF37">
