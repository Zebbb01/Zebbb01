<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 264" width="1200" height="264" role="img" aria-label="Currently building ProfitView Accounting — 24 modules live, 158K lines of TypeScript, 92 test suites in CI, release v0.66">
  <title>Currently building — ProfitView Accounting</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity=".15"/>
