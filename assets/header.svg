<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Gerald Villaceran — Full-Stack Engineer and Systems Architect">
  <title>Gerald Villaceran — Full-Stack Engineer and Systems Architect</title>
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset=".5" stop-color="#D4AF37" stop-opacity=".55"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8D48B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E8D48B" stop-opacity=".9"/>
      <stop offset="1" stop-color="#E8D48B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".75">
      <stop offset="0" stop-color="#D4AF37" stop-opacity=".14"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D4AF37" fill-opacity=".14"/>
    </pattern>
    <linearGradient id="vfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".75" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade"><rect width="1200" height="300" fill="url(#vfade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#060606"/>
    <rect width="1200" height="300" fill="url(#dots)" mask="url(#fade)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <rect x="0" y="0" width="1200" height="1" fill="url(#rule)"/>
    <rect x="-320" y="0" width="320" height="1" fill="url(#sheen)">
      <animate attributeName="x" values="-320;1200" dur="7s" repeatCount="indefinite"/>
    </rect>

    <g font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" text-anchor="middle">
      <text x="600" y="98" font-size="13" letter-spacing="6.5" fill="#6B6355" opacity="0">PORTFOLIO &#183; PHILIPPINES &#183; GMT+8
        <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur=".7s" fill="freeze"/>
      </text>
      <text x="600" y="266" font-size="11.5" letter-spacing="4.5" fill="#6B6355" opacity="0">SAAS PLATFORMS &#183; MOBILE APPS &#183; BUSINESS AUTOMATION &#183; SYSTEM ARCHITECTURE
        <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur=".8s" fill="freeze"/>
      </text>
    </g>

    <text x="600" y="166" text-anchor="middle" font-family="'Outfit','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
          font-size="58" font-weight="300" letter-spacing="11" fill="#F5F0E8" opacity="0">GERALD VILLACERAN
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur=".9s" fill="freeze"/>
    </text>

    <rect x="600" y="196" width="0" height="1" fill="#D4AF37" fill-opacity=".7">
      <animate attributeName="width" from="0" to="360" begin="0.7s" dur=".8s" fill="freeze"/>
      <animate attributeName="x" from="600" to="420" begin="0.7s" dur=".8s" fill="freeze"/>
    </rect>

    <text x="600" y="228" text-anchor="middle" font-family="'Outfit','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
          font-size="15" font-weight="500" letter-spacing="5.5" fill="#D4AF37" opacity="0">FULL-STACK ENGINEER &#183; SYSTEMS ARCHITECT
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur=".8s" fill="freeze"/>
    </text>
  </g>
</svg>
